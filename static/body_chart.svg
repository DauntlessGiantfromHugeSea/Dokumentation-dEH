<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360"
     class="body-chart-svg" preserveAspectRatio="xMidYMid meet">
  <style>
    .body-outline { fill: none; stroke: #1d1815; stroke-width: 1.6;
                     stroke-linejoin: round; stroke-linecap: round; }
    .body-detail  { fill: none; stroke: #1d1815; stroke-width: 0.6;
                     stroke-dasharray: 1.5 1.5; }
    .body-label   { fill: #7a6f6a; font: 11px sans-serif; }
    .body-bg      { fill: #ffffff; stroke: #ece8e4; stroke-width: 1; }
  </style>
  <!-- Vorderseite -->
  <g transform="translate(20, 10)">
    <rect class="body-bg" x="0" y="0" width="160" height="340" rx="8"/>
    <text class="body-label" x="80" y="335" text-anchor="middle">vorne</text>
    <!-- Kopf -->
    <ellipse class="body-outline" cx="80" cy="38" rx="26" ry="32"/>
    <!-- Hals -->
    <path class="body-outline" d="M 65 66 Q 80 76 95 66"/>
    <!-- Schultern + Torso -->
    <path class="body-outline" d="M 38 86 Q 50 76 80 76 Q 110 76 122 86 L 122 200 Q 100 220 80 220 Q 60 220 38 200 Z"/>
    <!-- Mittellinie Torso -->
    <line class="body-detail" x1="80" y1="76" x2="80" y2="220"/>
    <!-- Brust-Andeutung -->
    <path class="body-detail" d="M 56 110 Q 80 100 104 110"/>
    <path class="body-detail" d="M 60 140 Q 80 150 100 140"/>
    <!-- Arme: Schulter→Ellbogen→Handgelenk -->
    <path class="body-outline" d="M 38 86 L 28 150 L 24 210 L 18 252"/>
    <path class="body-outline" d="M 122 86 L 132 150 L 136 210 L 142 252"/>
    <!-- Innere Armkonturen (für Volumen) -->
    <path class="body-detail" d="M 50 92 L 42 158 L 38 215"/>
    <path class="body-detail" d="M 110 92 L 118 158 L 122 215"/>
    <!-- Hände -->
    <ellipse class="body-outline" cx="14" cy="262" rx="9" ry="11"/>
    <ellipse class="body-outline" cx="146" cy="262" rx="9" ry="11"/>
    <!-- Beine: Hüfte→Knie→Fuß -->
    <path class="body-outline" d="M 56 220 L 50 280 L 48 320"/>
    <path class="body-outline" d="M 80 220 L 78 280 L 78 320"/>
    <path class="body-outline" d="M 104 220 L 110 280 L 112 320"/>
    <!-- Knie -->
    <line class="body-detail" x1="48" y1="270" x2="78" y2="270"/>
    <line class="body-detail" x1="80" y1="270" x2="112" y2="270"/>
    <!-- Füße -->
    <ellipse class="body-outline" cx="63" cy="325" rx="14" ry="6"/>
    <ellipse class="body-outline" cx="95" cy="325" rx="14" ry="6"/>
    <!-- Clickable Area -->
    <rect class="body-hitbox" data-side="front"
          x="0" y="0" width="160" height="340"
          fill="transparent" pointer-events="all"/>
  </g>

  <!-- Rückseite -->
  <g transform="translate(220, 10)">
    <rect class="body-bg" x="0" y="0" width="160" height="340" rx="8"/>
    <text class="body-label" x="80" y="335" text-anchor="middle">hinten</text>
    <!-- Kopf -->
    <ellipse class="body-outline" cx="80" cy="38" rx="26" ry="32"/>
    <!-- Hals -->
    <path class="body-outline" d="M 65 66 Q 80 76 95 66"/>
    <!-- Schultern + Torso -->
    <path class="body-outline" d="M 38 86 Q 50 76 80 76 Q 110 76 122 86 L 122 200 Q 100 220 80 220 Q 60 220 38 200 Z"/>
    <!-- Wirbelsäule -->
    <line class="body-detail" x1="80" y1="76" x2="80" y2="220"/>
    <!-- Schulterblätter -->
    <path class="body-detail" d="M 50 100 Q 70 120 70 150"/>
    <path class="body-detail" d="M 110 100 Q 90 120 90 150"/>
    <!-- Gesäßlinie -->
    <ellipse class="body-detail" cx="65" cy="205" rx="18" ry="14"/>
    <ellipse class="body-detail" cx="95" cy="205" rx="18" ry="14"/>
    <!-- Arme -->
    <path class="body-outline" d="M 38 86 L 28 150 L 24 210 L 18 252"/>
    <path class="body-outline" d="M 122 86 L 132 150 L 136 210 L 142 252"/>
    <path class="body-detail" d="M 50 92 L 42 158 L 38 215"/>
    <path class="body-detail" d="M 110 92 L 118 158 L 122 215"/>
    <!-- Hände -->
    <ellipse class="body-outline" cx="14" cy="262" rx="9" ry="11"/>
    <ellipse class="body-outline" cx="146" cy="262" rx="9" ry="11"/>
    <!-- Beine -->
    <path class="body-outline" d="M 56 220 L 50 280 L 48 320"/>
    <path class="body-outline" d="M 80 220 L 78 280 L 78 320"/>
    <path class="body-outline" d="M 104 220 L 110 280 L 112 320"/>
    <line class="body-detail" x1="48" y1="270" x2="78" y2="270"/>
    <line class="body-detail" x1="80" y1="270" x2="112" y2="270"/>
    <!-- Füße -->
    <ellipse class="body-outline" cx="63" cy="325" rx="14" ry="6"/>
    <ellipse class="body-outline" cx="95" cy="325" rx="14" ry="6"/>
    <rect class="body-hitbox" data-side="back"
          x="0" y="0" width="160" height="340"
          fill="transparent" pointer-events="all"/>
  </g>
</svg>
