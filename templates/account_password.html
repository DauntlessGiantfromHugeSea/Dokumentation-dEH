{% extends "base.html" %}
{% block title %}Passwort ändern{% endblock %}
{% block content %}
<h1>Passwort ändern</h1>
<p class="tagline">
  Angemeldet als <strong>{{ current_user.full_name or current_user.username }}</strong>.
</p>

<form method="post" class="card stack" style="max-width: 480px;">
  <div class="card-header">Neues Passwort setzen</div>
  <label class="field">
    Aktuelles Passwort
    <input name="current_password" type="password" required
           autocomplete="current-password">
  </label>
  <label class="field">
    Neues Passwort
    <input name="new_password" type="password" required minlength="6"
           autocomplete="new-password">
  </label>
  <label class="field">
    Neues Passwort bestätigen
    <input name="confirm_password" type="password" required minlength="6"
           autocomplete="new-password">
  </label>
  <div class="btn-row">
    <button class="btn" type="submit">Passwort ändern</button>
    <a class="btn secondary" href="{{ url_for('index') }}">Abbrechen</a>
  </div>
</form>
{% endblock %}
