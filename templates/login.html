{% extends "base.html" %}
{% block title %}Anmelden{% endblock %}
{% block content %}
<div class="login-wrap card">
  <h1>Erste Hilfe</h1>
  <p class="subtitle" style="text-align:center;">Camp-Dokumentation</p>
  <form method="post" class="stack">
    <label class="field">
      Benutzername
      <input name="username" autocomplete="username" autofocus required>
    </label>
    <label class="field">
      Passwort oder PIN
      <input name="password" type="password" autocomplete="current-password" required>
    </label>
    <button class="btn lg" type="submit" style="width: 100%;">Anmelden</button>
    <p class="muted" style="font-size: 0.82rem; text-align: center; margin: 4px 0 0;">
      PIN kannst du nach dem ersten Login unter „Passwort &amp; 2FA" einrichten.
    </p>
  </form>
</div>
{% endblock %}
